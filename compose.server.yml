services:
  app:
    image: ${RUNNING_IMAGE:-ghcr.io/bringbasket/running-tools:latest}
    container_name: running-tools
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNNING_REDIS_ADDR: redis:6379
      RUNNING_REDIS_PASSWORD: ${RUNNING_REDIS_PASSWORD:?Set RUNNING_REDIS_PASSWORD in .env}
      RUNNING_DATABASE_URL: postgres://running_tools:${RUNNING_POSTGRES_PASSWORD:?Set RUNNING_POSTGRES_PASSWORD in .env}@postgres:5432/running_tools?sslmode=disable
    ports:
      - "127.0.0.1:${RUNNING_HOST_PORT:-8091}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - running-tools-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      RUNNING_REDIS_PASSWORD: ${RUNNING_REDIS_PASSWORD:?Set RUNNING_REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${RUNNING_REDIS_PASSWORD:?Set RUNNING_REDIS_PASSWORD in .env}"]
    volumes:
      - running-tools-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$RUNNING_REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - running-tools-internal

  postgres:
    image: postgres:15-alpine
    container_name: running-tools-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: running_tools
      POSTGRES_USER: running_tools
      POSTGRES_PASSWORD: ${RUNNING_POSTGRES_PASSWORD:?Set RUNNING_POSTGRES_PASSWORD in .env}
    volumes:
      - running-tools-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U running_tools -d running_tools"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - running-tools-internal

volumes:
  running-tools-redis:
  running-tools-postgres:

networks:
  running-tools-internal:
