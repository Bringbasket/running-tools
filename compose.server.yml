services:
  app:
    image: ${RUNNING_IMAGE:-ghcr.io/bringbasket/running-tools:latest}
    container_name: running-tools
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # PostgreSQL is supplied by the existing host/service through .env.
      # Do not add a project-owned database container here.
      RUNNING_REDIS_ADDR: redis:6379
      RUNNING_REDIS_PASSWORD: ${RUNNING_REDIS_PASSWORD:?Set RUNNING_REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RUNNING_HOST_PORT:-8091}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 10s
    depends_on:
      redis:
        condition: service_started
    networks:
      - running-tools-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      RUNNING_REDIS_PASSWORD: ${RUNNING_REDIS_PASSWORD:?Set RUNNING_REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${RUNNING_REDIS_PASSWORD:?Set RUNNING_REDIS_PASSWORD in .env}"]
    volumes:
      - running-tools-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$RUNNING_REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - running-tools-internal

volumes:
  running-tools-redis:

networks:
  running-tools-internal:
