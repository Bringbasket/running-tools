name: Build and publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.env.example'
      - '.gitignore'
      - 'deploy/**'
  workflow_dispatch:

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNING_VERSION: 0.0.${{ github.run_number }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test ./...
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            RUNNING_VERSION=${{ env.RUNNING_VERSION }}
            RUNNING_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/bringbasket/running-tools:latest
            ghcr.io/bringbasket/running-tools:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Bringbasket/hme-tools
            org.opencontainers.image.version=${{ env.RUNNING_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
